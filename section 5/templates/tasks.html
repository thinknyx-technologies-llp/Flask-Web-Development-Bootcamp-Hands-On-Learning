<!DOCTYPE html>
<html>
<head>
    <title>Task Manager</title>
</head>
<body>
    <h1>Task Manager</h1>

    <form method="POST" action="/tasks">
        <input type="text" name="title" placeholder="New task title" required>
        <button type="submit">Add Task</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            <strong>{{ task.title }}</strong> - 
            {% if task.completed %}✅ Completed{% else %}❌ Pending{% endif %}
            
            <form method="POST" action="/tasks/{{ task.id }}/update" style="display:inline;">
                <input type="text" name="title" value="{{ task.title }}">
                <label>
                    <input type="checkbox" name="completed" {% if task.completed %}checked{% endif %}>
                    Completed
                </label>
                <button type="submit">Update</button>
            </form>
            
            <form method="POST" action="/tasks/{{ task.id }}/delete" style="display:inline;">
                <button type="submit">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</body>
</html>

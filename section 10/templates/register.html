{% extends 'base.html' %}

{% block content %}
<h2>Register</h2>

<form method="POST">
    {{ form.hidden_tag() }}

    {{ form.username.label }}
    {{ form.username() }}

    {{ form.password.label }}
    {{ form.password() }}

    {{ form.submit() }}
</form>
<h2>Already have an account?</h2>
<a href="/login">Login</a>
{% endblock %}

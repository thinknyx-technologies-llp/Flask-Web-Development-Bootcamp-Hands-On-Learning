<!DOCTYPE html>
<html>
    <head>
        <title>{% block title %} {% endblock%}</title>
        <style>
            body {
                font-family: sans-serif;
                margin: 0;
                padding: 20px;
                background: #f4f4f4;
            }
            .container {
                max-width: 800px;
                margin: auto;
                background: white;
                padding: 30px;
                border-radius: 8px;
                box-shadow: 0 2px 10px rgba(0,0,0.1);
            }
            nav {
                margin-bottom: 20px;
                padding-bottom: 10px;
                border-bottom: 1px solid #ddd;
            }
            footer {
                margin-top: 30px;
                text-align: center;
                font-size: 0.9em;
                color: #666;
            }
            .badge {
                background: #007bff;
                color: white;
                padding: 3px 8px;
                border-radius: 4px;
                font-size: 0.8em;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <nav>
                <strong>This is the main site</strong> <a href="/">Dashboard</a>
            </nav>
            <main>
                {% block content %} {% endblock %}
            </main>
            <footer>
                &copy; 2026 This site - Built with Flask and Jinja
            </footer>
        </div>
    </body>
</html>

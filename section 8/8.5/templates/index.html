<!DOCTYPE html>
<html>
<head>
    <title>Flask SQLite CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>User Management (CRUD)</h2>
 
    <div class="card card-body mb-4">
        <h5>Add New User</h5>
        <form action="/add" method="POST" class="row g-3">
            <div class="col-md-5"><input type="text" name="username" class="form-control" placeholder="Username" required></div>
            <div class="col-md-5"><input type="email" name="email" class="form-control" placeholder="Email" required></div>
            <div class="col-md-2"><button type="submit" class="btn btn-success w-100">Add</button></div>
        </form>
    </div>
 
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th><th>Username</th><th>Email</th><th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for u in users %}
            <tr>
                <form action="/update/{{ u.id }}" method="POST">
                    <td>{{ u.id }}</td>
                    <td><input type="text" name="username" value="{{ u.username }}" class="form-control form-control-sm"></td>
                    <td><input type="email" name="email" value="{{ u.email }}" class="form-control form-control-sm"></td>
                    <td>
                        <button type="submit" class="btn btn-primary btn-sm">Update</button>
                        <a href="/delete/{{ u.id }}" class="btn btn-danger btn-sm">Delete</a>
                    </td>
                </form>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>

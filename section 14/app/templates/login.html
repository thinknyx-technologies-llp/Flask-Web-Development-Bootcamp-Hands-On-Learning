{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Login</h1>

    <form method="POST">

        {{ form.hidden_tag() }}

        <div class="form-group">
            {{ form.email.label }}
            {{ form.email(class="form-control") }}
        </div>

        <div class="form-group">
            {{ form.password.label }}
            {{ form.password(class="form-control") }}
        </div>

        {{ form.submit(class="btn") }}

    </form>

    <p class="link-text">
        Don't have an account?
        <a href="{{ url_for('auth.register') }}">Register</a>
    </p>

</div>

{% endblock %}

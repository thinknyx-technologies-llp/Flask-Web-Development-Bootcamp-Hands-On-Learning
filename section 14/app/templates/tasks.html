{% extends "base.html" %}

{% block content %}

<div class="form-container">

    <h1>Add New Task</h1>

    <form method="POST">

        {{ form.hidden_tag() }}

        <div class="form-group">
            {{ form.title.label }}
            {{ form.title(class="form-control") }}
        </div>

        {{ form.submit(class="btn") }}

    </form>

</div>

{% endblock %}
